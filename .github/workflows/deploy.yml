name: Build and Push Backend Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: QEMU Kurulumu (ARM emülasyonu için)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry'e Giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker İmajını Derle ve Yükle
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gurmepet-backend:latest
            ghcr.io/${{ github.repository_owner }}/gurmepet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max